; SIP over UDP on 5060.
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; Calls from your SIP trunk (carrier). Fill in when you pick one; for now
; anything that reaches this server without matching a registered user is
; treated as coming from the trunk (see [trunk-identify]).
[trunk]
type = endpoint
context = from-trunk
disallow = all
allow = ulaw,alaw,g722
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733

[trunk-identify]
type = identify
endpoint = trunk
match = 0.0.0.0/0
