; Self-contained Asterisk instance for the phone gateway.
; Start with: asterisk -C <this dir>/asterisk.conf   (see ../start.sh)
[directories]
astetcdir => __ETC__
astmoddir => /usr/lib/x86_64-linux-gnu/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => __RUN__/db
astkeydir => /var/lib/asterisk
astdatadir => /usr/share/asterisk
astagidir => /usr/share/asterisk/agi-bin
astspooldir => __RUN__/spool
astrundir => __RUN__/run
astlogdir => __RUN__/log
astsbindir => /usr/sbin

[options]
verbose = 3
nocolor = yes
