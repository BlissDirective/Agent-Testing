; Every inbound call is handed to the gateway's ARI application.
[from-trunk]
exten => _X.,1,NoOp(Inbound call to ${EXTEN})
 same => n,Stasis(gateway,inbound,${EXTEN})
 same => n,Hangup()
exten => _+X.,1,Stasis(gateway,inbound,${EXTEN})
 same => n,Hangup()
exten => _[a-z].,1,Stasis(gateway,inbound,${EXTEN})
 same => n,Hangup()

; ---- Test helpers (used by the gateway's live tests; safe to delete) ----
; Fake callers/callees. Tests set the global HEARD_PREFIX (via ARI) to say
; where "listener" saves what it hears; DIGITS sets what "presser" presses.
[gateway-test]
exten => listener,1,Answer()
 same => n,Set(FILE=${IF($["${HEARD}" = ""]?${GLOBAL(HEARD_PREFIX)}-${UNIQUEID}:${HEARD})})
 same => n,Set(GLOBAL(LAST_HEARD)=${FILE})
 same => n,Record(${FILE}.wav,0,${IF($["${LISTEN_SECONDS}" = ""]?6:${LISTEN_SECONDS})},qk)
 same => n,Hangup()
exten => presser,1,Answer()
 same => n,Wait(1.5)
 same => n,SendDTMF(${IF($["${DIGITS}" = ""]?123#:${DIGITS})},250)
 same => n,Wait(4)
 same => n,Hangup()
exten => talker,1,Answer()
 same => n,Set(FILE=${IF($["${HEARD}" = ""]?${GLOBAL(HEARD_PREFIX)}-${UNIQUEID}:${HEARD})})
 same => n,Set(GLOBAL(LAST_HEARD)=${FILE})
 ; r() keeps only the audio this caller receives, i.e. what it "hears".
 same => n,MixMonitor(${FILE}-both.wav,r(${FILE}.wav))
 same => n,Wait(0.5)
 same => n,Playback(tt-weasels)
 same => n,Wait(${IF($["${TALK_TAIL}" = ""]?1:${TALK_TAIL})})
 same => n,Hangup()
exten => answerer,1,Answer()
 same => n,Playback(tt-weasels)
 same => n,Hangup()
exten => speaker,1,Answer()
 ; Says ${SPEAK_FILE} (a sound path without extension) after ${SPEAK_AFTER} s,
 ; recording what it hears like "talker".
 same => n,Set(FILE=${GLOBAL(HEARD_PREFIX)}-${UNIQUEID})
 same => n,Set(GLOBAL(LAST_HEARD)=${FILE})
 same => n,MixMonitor(${FILE}-both.wav,r(${FILE}.wav))
 same => n,Wait(${IF($["${SPEAK_AFTER}" = ""]?1:${SPEAK_AFTER})})
 same => n,Playback(${SPEAK_FILE})
 same => n,Wait(${IF($["${TALK_TAIL}" = ""]?6:${TALK_TAIL})})
 same => n,Hangup()
